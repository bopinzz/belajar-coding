<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER IT DASHBOARD</title>

<link rel="stylesheet" href="dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Background -->

<div class="grid"></div>

<div class="scan-line"></div>

<div class="glow glow1"></div>

<div class="glow glow2"></div>

<div class="container">

<div class="panel">

<!-- Header -->

<div class="top-bar">

<h1>CYBER IT DASHBOARD</h1>

<div class="clock" id="clock">
00:00:00
</div>

</div>

<!-- Welcome -->

<div class="welcome">

<h2>WELCOME MEMBER</h2>

<p>
Selamat datang di CYBER IT Community.
Semua data member tersimpan secara otomatis.
</p>

</div>

<!-- Search -->

<div class="search-box">

<input
type="text"
id="search"
placeholder="Cari nama member...">

<button id="refreshBtn">

🔄 REFRESH

</button>

</div>

<!-- Data Member -->

<div class="table-container">

<table>

<thead>

<tr>

<th>No</th>

<th>Nama</th>

<th>Umur</th>

<th>Domisili</th>

<th>WhatsApp</th>

<th>Nickname</th>

<th>Alasan</th>

<th>Tanggal</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="tableData">

<tr>

<td colspan="9">

Belum ada data member.

</td>

</tr>

</tbody>

</table>

</div>

<!-- Action -->

<div class="action">

<button id="joinGroup" class="join">

🚀 JOIN GROUP

</button>

<button id="deleteAll" class="delete">

🗑 HAPUS SEMUA

</button>

<button id="exportData" class="export">

📥 EXPORT DATA

</button>

</div>

<!-- Footer -->

<footer class="footer">

<p>

CYBER IT MEMBER SYSTEM © 2026 | BY BOPINZZ

</p>

</footer>

</div>

</div>

<!-- Audio -->

<audio id="clickSound">

<source src="assets/click.mp3" type="audio/mpeg">

</audio>

<script src="dashboard.js"></script>

</body>

</html>
