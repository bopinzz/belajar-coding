<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BELAJAR CODING BY BOPINZZ M4</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#001f4d,#003366,#0066cc);
color:#fff;
}

/* Background Partikel */
#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* Card */
.card{
width:380px;
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(0,170,255,.6);
animation:fade .8s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
text-align:center;
font-size:34px;
margin-bottom:10px;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:5px;
color:#5fd2ff;
}

p{
text-align:center;
font-size:14px;
color:#ddd;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:white;
font-size:15px;
outline:none;
}

input::placeholder,
textarea::placeholder{
color:#ddd;
}

textarea{
height:90px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00aaff;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0088dd;
transform:scale(1.03);
box-shadow:0 0 20px #00ccff;
}

.footer{
margin-top:15px;
text-align:center;
font-size:13px;
color:#bbb;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="card">

<div class="logo">💻</div>

<h1>BELAJAR CODING BY BOPINZZ M4</h1>

<p>ISI SEMUA FORMULIR DI BAWAH INI.</p>

<input
type="text"
id="nama"
placeholder="Nama Lengkap">

<input
type="tel"
id="wa"
placeholder="Nomor WhatsApp">

<input
type="number"
id="umur"
placeholder="Umur">

<textarea
id="alasan"
placeholder="Alasan ingin bergabung"></textarea>

<button onclick="daftar()">
Daftar Sekarang
</button>

<div class="footer">
𝘽𝙀𝙇𝘼𝙅𝘼𝙍 𝘾𝙊𝘿𝙄𝙉𝙂 𝙄𝙏𝙐 𝙆𝘼𝙔𝘼 𝙉𝘼𝙄𝙆 𝙂𝙐𝙉𝙐𝙉𝙂 
𝘾𝘼𝙋𝙀𝙆 𝘿𝙄 𝘼𝙒𝘼𝙇 
𝘽𝙄𝙉𝙂𝙐𝙉𝙂 𝘿𝙄 𝙏𝙀𝙉𝙂𝘼𝙃 
𝙏𝘼𝙋𝙄 𝙄𝙉𝘿𝘼𝙃 𝙎𝘼𝘼𝙏 𝙆𝘼𝙈𝙐 𝙇𝙄𝘼𝙏 𝙃𝘼𝙎𝙄𝙇 𝙆𝙀𝙍𝙅𝘼 𝙆𝙀𝙍𝘼𝙎 𝙈𝙐 𝙎𝙀𝙉𝘿𝙄𝙍𝙄
</div>

</div>

<script>
// ===========================
// GANTI DENGAN LINK GRUP KAMU
// ===========================
const GROUP_LINK = "https://chat.whatsapp.com/EueJ5Xs4PhA69iZnlrQWHA";

// Tombol Daftar
function daftar(){

    let nama = document.getElementById("nama").value.trim();
    let wa = document.getElementById("wa").value.trim();
    let umur = document.getElementById("umur").value.trim();
    let alasan = document.getElementById("alasan").value.trim();

    if(nama==="" || wa==="" || umur==="" || alasan===""){
        alert("MOHON UNTUK LENGKAPI SEMUA DATA!!!");
        return;
    }

    if(!/^08[0-9]{8,12}$/.test(wa)){
        alert("Nomor WhatsApp tidak valid.");
        return;
    }

    alert(
`Pendaftaran Berhasil!

Nama : ${nama}
WhatsApp : ${wa}

WELCOME TO DUNIA CODING, YANG DI MANA OTAK LU HARUS 100% DI PAKE`
    );

    window.location.href = GROUP_LINK;
}

// ===========================
// Background Partikel Biru
// ===========================

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize",resize);

const particles=[];

for(let i=0;i<120;i++){

    particles.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3+1,
        dx:(Math.random()-0.5)*0.8,
        dy:(Math.random()-0.5)*0.8

    });

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        ctx.fillStyle="#3fc7ff";
        ctx.shadowBlur=20;
        ctx.shadowColor="#00bfff";

        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0)p.x=canvas.width;
        if(p.x>canvas.width)p.x=0;

        if(p.y<0)p.y=canvas.height;
        if(p.y>canvas.height)p.y=0;

    });

    requestAnimationFrame(draw);

}

draw();
</script>

</body>
</html>
